name: Publish bottle designs
on:
  push:
    paths:
      - '.github/workflows/publish-bottle-designs.yml'
permissions:
  contents: write
jobs:
  update-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update perfume bottle visuals
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          visual = '.product-visual{height:260px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#f6e9c9 0%,#e9d5a4 35%,#c59b4c 68%,#8a6325 100%);overflow:hidden}'
          styles = '.bottle-image{display:block;width:150px;max-width:74%;height:auto;max-height:208px;object-fit:contain;filter:drop-shadow(0 20px 26px rgba(40,22,6,.34))}.modal-bottle-image{display:block;width:min(74%,245px);height:auto;max-height:360px;object-fit:contain;filter:drop-shadow(0 28px 34px rgba(40,22,6,.34))}'
          if '.bottle-image{' not in text:
              text = text.replace(visual, visual + styles, 1)
          text = text.replace('<div class="bottle"><div class="h">H</div><div class="name">Sweet Night Out</div></div>', '<img class="bottle-image" src="assets/sweet-night-out-bottle.svg" alt="Sweet Night Out bottle">')
          text = text.replace('<div class="bottle aegean"><div class="h">H</div><div class="name">Aegean Gold</div></div>', '<img class="bottle-image" src="assets/aegean-gold-bottle.svg" alt="Aegean Gold bottle">')
          text = text.replace('<div class="bottle helios"><div class="h">H</div><div class="name">Helios Nectar</div></div>', '<img class="bottle-image" src="assets/helios-nectar-bottle.svg" alt="Helios Nectar bottle">')
          text = text.replace('<div class="modal-visual"><img class="bottle-image" src="assets/sweet-night-out-bottle.svg" alt="Sweet Night Out bottle"></div>', '<div class="modal-visual"><img class="modal-bottle-image" src="assets/sweet-night-out-bottle.svg" alt="Sweet Night Out bottle"></div>')
          text = text.replace('<div class="modal-visual"><img class="bottle-image" src="assets/aegean-gold-bottle.svg" alt="Aegean Gold bottle"></div>', '<div class="modal-visual"><img class="modal-bottle-image" src="assets/aegean-gold-bottle.svg" alt="Aegean Gold bottle"></div>')
          text = text.replace('<div class="modal-visual helios-bg"><img class="bottle-image" src="assets/helios-nectar-bottle.svg" alt="Helios Nectar bottle"></div>', '<div class="modal-visual helios-bg"><img class="modal-bottle-image" src="assets/helios-nectar-bottle.svg" alt="Helios Nectar bottle"></div>')
          p.write_text(text, encoding='utf-8')
      - name: Commit storefront update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use new HILLERYS bottle designs"
          git push
