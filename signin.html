<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — HILLERYS</title>
<style>
:root{--bg:#faf7ef;--panel:#fffdf8;--line:#e4d7bf;--text:#382611;--muted:#89765c;--gold:#a9792c;--gold2:#c79b4e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fffdf8,#f5ecdc);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}header{height:76px;border-bottom:1px solid var(--line);background:#fffdf8e8;backdrop-filter:blur(16px);display:flex;align-items:center}.head{display:flex;align-items:center;justify-content:space-between;width:100%}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:1.35rem;letter-spacing:.22em}.mark{font-size:1.8rem;color:var(--gold2);border-right:1px solid #6a5434;padding-right:10px}.back{font-size:.84rem;color:#6e552f}.main{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:42px 16px}.card{width:min(470px,100%);background:var(--panel);border:1px solid #dfceb0;border-radius:22px;box-shadow:0 20px 60px #8f6f3826;padding:34px}.eyebrow{text-transform:uppercase;letter-spacing:.26em;font-size:.66rem;font-weight:800;color:var(--gold)}h1{font-family:Georgia,serif;font-size:2.45rem;font-weight:500;margin:8px 0 10px}.sub{color:#78654a;line-height:1.6;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f6efdf;border:1px solid #e2d3b8;border-radius:12px;padding:5px;margin-bottom:20px}.tab{border:0;background:transparent;border-radius:9px;padding:10px;color:#755b33;font-weight:750;cursor:pointer}.tab.active{background:#fffdf8;color:#7d591f;box-shadow:0 3px 10px #86682d1f}.field{margin-bottom:14px}.field label{display:block;font-size:.74rem;color:#6f5b3d;margin-bottom:7px}.field input{width:100%;border:1px solid #d7c09a;background:#fffefb;border-radius:11px;padding:13px 14px;color:var(--text);outline:none}.field input:focus{border-color:#b98b3b;box-shadow:0 0 0 3px #c79b4e22}.continue{width:100%;border:1px solid #a9792c;background:linear-gradient(110deg,#a9792c,#d1a856);color:#fff;border-radius:11px;padding:14px;font-weight:800;cursor:pointer;margin-top:5px}.continue:hover{filter:brightness(.98)}.help{text-align:center;color:#8a775c;font-size:.76rem;line-height:1.5;margin:17px 0 0}.notice{display:none;margin-top:16px;padding:12px;border:1px solid #d3ad63;background:#fff3d9;color:#6c4b1d;border-radius:10px;font-size:.82rem;line-height:1.45}@media(max-width:520px){.card{padding:26px 20px}h1{font-size:2.05rem}.brand{font-size:1.1rem;letter-spacing:.16em}}
</style>
</head>
<body>
<header><div class="wrap head"><a class="brand" href="index.html"><span class="mark">H</span>HILLERYS</a><a class="back" href="index.html">← Back to shop</a></div></header>
<main class="main"><section class="card"><div class="eyebrow">HILLERYS ACCOUNT</div><h1>Welcome back</h1><p class="sub">Sign in with your email address or phone number.</p><div class="tabs"><button class="tab active" id="emailTab" type="button">Email</button><button class="tab" id="phoneTab" type="button">Phone</button></div><form id="signInForm"><div class="field"><label id="fieldLabel" for="identity">Email address</label><input id="identity" name="identity" type="email" autocomplete="email" placeholder="you@example.com" required></div><button class="continue" type="submit">Continue</button><div class="notice" id="notice"></div></form><p class="help">We’ll use your details only to continue the sign-in process. Account verification is not connected yet.</p></section></main>
<script>
const emailTab=document.getElementById('emailTab'),phoneTab=document.getElementById('phoneTab'),field=document.getElementById('identity'),label=document.getElementById('fieldLabel'),notice=document.getElementById('notice');
function setMode(mode){const email=mode==='email';emailTab.classList.toggle('active',email);phoneTab.classList.toggle('active',!email);label.textContent=email?'Email address':'Phone number';field.type=email?'email':'tel';field.placeholder=email?'you@example.com':'07123 456789';field.autocomplete=email?'email':'tel';field.value='';notice.style.display='none';field.focus()}
emailTab.onclick=()=>setMode('email');phoneTab.onclick=()=>setMode('phone');
document.getElementById('signInForm').addEventListener('submit',e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;notice.style.display='block';notice.textContent='Your sign-in details are ready. Connect an authentication service to send a secure code and complete sign in.'});
</script>
</body>
</html>
